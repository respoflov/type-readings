<!DOCTYPE html>
<!-- 연애 유형 진단소(Type Readings): 19문항 3축 진단, 사주·MBTI 심화 리딩, 궁합, 보관함. 화면·스타일·로직·데이터를 이 파일 하나에 담았다 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f0e1">
<title>연애 유형 진단소</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f0e1; --card:#fdfaf1; --ink:#3c352a; --sub:#746b58;
    --line:#c5af7d; --green:#2f5d44; --green-soft:#e9efe8;
    --red:#a3473b; --red-soft:#f2e3de; --radius:14px;
    /* 오행 색 */
    --e-mok:#3f7350; --e-hwa:#a3473b; --e-to:#b08d45; --e-geum:#9a948a; --e-su:#33475c;
  }
  /* 다크모드. 라이트의 포인트컬러(초록, --green)만 차분한 붉은 계열로 교체.
     변수명은 그대로 유지해 전체 코드가 자동으로 새 색을 따라가게 함.
     순검정/순백 금지 원칙에 맞춰 완전한 검정 대신 톤다운된 다크 브라운 사용. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#211c17; --card:#2b241d; --ink:#eee6d8; --sub:#a89a86;
      --line:#5c4f42; --green:#c17b5f; --green-soft:#3d2b23;
      --red:#e06552; --red-soft:#3a2620;
      --e-mok:#7fb88f; --e-hwa:#e08a72; --e-to:#d4b06a; --e-geum:#c9c2b4; --e-su:#7c93b0;
    }
  }
  :root[data-theme="dark"]{
    --paper:#211c17; --card:#2b241d; --ink:#eee6d8; --sub:#a89a86;
    --line:#5c4f42; --green:#c17b5f; --green-soft:#3d2b23;
    --red:#e06552; --red-soft:#3a2620;
    --e-mok:#7fb88f; --e-hwa:#e08a72; --e-to:#d4b06a; --e-geum:#c9c2b4; --e-su:#7c93b0;
  }
  .theme-toggle{position:absolute; top:16px; right:16px; border:1px solid var(--line);
    background:var(--card); color:var(--sub); border-radius:99px; width:34px; height:34px;
    padding:0; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:5;
    transition:transform .12s ease-out;}
  .theme-toggle::before{content:''; position:absolute; inset:-3px;} /* 히트 영역만 40px로 확장, 시각 크기는 34px 유지 */
  .theme-toggle:hover{background:var(--green-soft);}
  .theme-toggle:active{transform:scale(.92);}
  .theme-toggle svg{display:block; width:17px; height:17px;}
  button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible{
    outline:2px solid var(--green); outline-offset:2px;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{background:var(--paper); color:var(--ink);
    font-family:'Apple SD Gothic Neo','Pretendard','Noto Sans KR',system-ui,sans-serif;
    font-size:15px; line-height:1.55; padding-bottom:40px;}
  .wrap{max-width:640px; margin:0 auto; padding:0 16px;}
  #splashScreen,#landingScreen{position:fixed; inset:0; background:var(--paper);
    display:flex; align-items:center; justify-content:center; transition:opacity .4s ease;}
  #splashScreen{z-index:10000; transition:opacity 1.5s ease;}
  #landingScreen{z-index:9999; transition:opacity 1s ease;}
  #splashScreen img{width:126px; height:126px; border-radius:27px;}
  #splashScreen.fade-out{opacity:0;}
  #landingScreen{flex-direction:column; text-align:center; padding:0 32px; cursor:pointer;}
  #landingScreen .lTitle{font-family:'Gowun Batang',serif; font-size:15px; font-weight:700; color:var(--ink);
    line-height:1.6; margin-bottom:22px; white-space:pre-line;}
  #landingScreen .lTitle b{color:var(--green);}
  #landingScreen .lTap{font-size:12.5px; color:var(--sub); letter-spacing:.02em;}
  #landingScreen.fade-out{opacity:0;}
  header.wrap{padding:64px 16px 10px; text-align:center; position:relative;}
  header h1{font-family:'Gowun Batang',serif; font-size:26px; font-weight:700; margin:0 0 4px; letter-spacing:.02em;}
  header h1 .dot{color:var(--green);}
  header p{margin:0; color:var(--sub); font-size:13px;}
  .disclaimer{display:block; margin-top:6px; font-size:11px; color:var(--sub);}
  nav{position:sticky; top:0; z-index:20; background:var(--paper); border-top:1px solid var(--line);
    border-bottom:1px solid var(--line); padding:0;}
  .tabs{display:flex; gap:28px; justify-content:center; max-width:640px; margin:0 auto; padding:0 16px;}
  .tab{flex:0 0 auto; border:none; background:none; color:var(--sub);
    padding:12px 2px; font-size:14px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;
    transition:color .12s ease-out;}
  .tab:hover{color:var(--ink);}
  .tab:active{opacity:.6;}
  .tab.on{color:var(--ink); font-weight:700; border-bottom-color:var(--green);}
  .sec-intro{margin:14px 2px 12px; font-size:13px; color:var(--sub);}
  .sec-intro b{color:var(--ink); font-family:'Gowun Batang',serif; font-size:15px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 15px 14px; margin-bottom:12px;}
  .q-num{font-family:'Gowun Batang',serif; font-size:13px; color:var(--green); font-weight:700;}
  .q-title{font-weight:700; font-size:16px; margin:4px 0 12px;}
  .opt{display:block; width:100%; text-align:left; border:1px solid var(--line); background:var(--paper);
    color:var(--ink); border-radius:12px; padding:12px 13px; font:inherit; font-size:14px;
    line-height:1.45; cursor:pointer; margin-bottom:8px;
    transition:transform .12s ease-out, border-color .15s ease-out;}
  .opt:hover{border-color:var(--ink);}
  .opt:active{transform:scale(.98);}
  .opt.sel{background:var(--ink); color:var(--card); border-color:var(--ink);}
  .progress{font-size:12px; color:var(--sub); text-align:center; margin:2px 0 10px; font-variant-numeric:tabular-nums;}
  .pbar{height:4px; background:var(--line); border-radius:99px; overflow:hidden; margin:0 2px 14px;}
  .pbar i{display:block; height:100%; background:var(--green); border-radius:99px; transition:.2s;}
  .btnrow{display:flex; gap:8px; margin-top:6px;}
  .btn{flex:1; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:12px; padding:12px; font:inherit; font-size:14px; cursor:pointer; font-weight:600;
    transition:transform .12s ease-out, filter .15s ease-out, border-color .15s ease-out;}
  .btn:hover:not(:disabled){border-color:var(--ink);}
  .btn:active:not(:disabled){transform:scale(.97);}
  .btn.primary{background:var(--green); border-color:var(--green); color:var(--paper); font-weight:700;}
  .btn.primary:hover:not(:disabled){filter:brightness(.92); border-color:var(--green);}
  .btn.danger{color:var(--red); border-color:#dcc0b8;}
  .btn:disabled{opacity:.4;}
  /* 결과 카드 */
  .tcard{text-align:center; padding:20px 15px 16px;}
  .tcard .tno{font-family:'Gowun Batang',serif; color:var(--green); font-size:13px; font-weight:700;}
  .tcard h2{font-family:'Gowun Batang',serif; font-size:23px; margin:4px 0 2px;}
  .tcard .catch{color:var(--sub); font-size:13.5px; margin-bottom:12px;}
  .tags{display:flex; flex-wrap:wrap; gap:6px; justify-content:center;}
  .tagchip{border:1px solid var(--line); background:var(--paper); border-radius:99px;
    padding:4px 11px; font-size:12px; display:inline-flex; align-items:center; gap:6px;}
  .esq{width:10px; height:10px; border-radius:3px; border:1px solid rgba(60,53,42,.25); display:inline-block;}
  .axisline{font-size:12.5px; color:var(--sub); margin-top:10px;}
  .axisline b{color:var(--ink);}
  .switch-note{margin-top:8px; font-size:12px; color:var(--red); background:var(--red-soft);
    border-radius:10px; padding:6px 10px; display:inline-block;}
  .sec{font-family:'Gowun Batang',serif; font-size:14.5px; color:var(--green);
    border-bottom:1px solid var(--line); padding-bottom:5px; margin:16px 0 8px;}
  /* 판정 근거 직후, 유형 카드 진입 전에 놓는 안내 — 1차 결과와 헷갈릴 수
     있다는 피드백으로 신설(2026-07-27). 위에 이미 종합 결과·근거를
     서술했지만, 긴 글을 건너뛰는 사용자를 위해 한 번 더 짚어준다. */
  .orient-note{border-top:1px solid var(--line); margin:20px 4px 14px; padding-top:14px; text-align:center;}
  .orient-note span{font-size:12px; color:var(--sub); letter-spacing:.03em; font-weight:600;}
  .r-item{padding:7px 0; border-bottom:1px dashed #eee5d0; font-size:13.5px;}
  .r-item:last-child{border-bottom:none;}
  .r-title{font-weight:700;}
  ul.bl{margin:6px 0 2px; padding-left:18px;}
  ul.bl li{margin-bottom:5px; font-size:13.5px;}
  details{border:1px solid var(--line); border-radius:12px; background:var(--paper);
    padding:10px 12px; margin-top:10px;}
  summary{cursor:pointer; font-size:13px; font-weight:700; color:var(--green); list-style:none;}
  summary::-webkit-details-marker{display:none;}
  summary::after{content:'▸'; float:right; color:var(--sub); font-size:12px;}
  details[open]>summary::after{content:'▾';}
  details.card{padding-top:14px;}
  summary.sec{cursor:pointer; margin-top:0;}
  .note{font-size:12px; color:var(--sub);}
  .sig{border:1px dashed var(--line); border-radius:12px; padding:9px 11px; margin-top:8px;
    font-size:13px; text-align:left; background:var(--paper);}
  .sig b{color:var(--green);}
  /* 일간 해석과 똑같은 4개 소제목이 바로 이어붙는 "일지까지 더하면" 구간을
     시각적으로 한 단계 안쪽(하위 섹션)처럼 보이게, 점선 테두리 박스로 감싸
     방금 읽은 걸 또 읽는 듯한 착시(중복처럼 보이는 문제)를 줄인다 */
  .subblock{border:1px dashed var(--line); border-radius:12px; padding:2px 12px 4px; background:var(--paper);}
  .subblock h3.sec{margin:12px 0 6px;}
  /* 심화 입력 */
  .fld{margin-bottom:12px;}
  .fld label{display:block; font-size:12.5px; color:var(--sub); margin-bottom:5px; font-weight:600;}
  select,input[type=text]{border:1px solid var(--line); border-radius:10px; background:#fffef9;
    color:#3c352a; font:inherit; font-size:14px; padding:9px 10px;}
  /* 입력창 배경은 라이트/다크 공통으로 항상 밝게 고정되므로, 글자색도
     var(--ink)로 테마에 따라 바꾸지 않고 항상 어둡게 고정한다
     (다크모드에서 밝은 글자 + 밝은 배경이 겹쳐 안 보이는 문제 방지) */
  .selrow{display:flex; gap:6px;}
  .selrow select{flex:1;}
  .slider-row{margin-bottom:14px;}
  .slider-labels{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:2px;
    font-variant-numeric:tabular-nums;}
  .slider-labels b{color:var(--green);}
  input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:20px; background:transparent; margin:0;}
  input[type=range]::-webkit-slider-runnable-track{height:4px; background:var(--line); border-radius:99px;}
  input[type=range]::-moz-range-track{height:4px; background:var(--line); border-radius:99px;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:16px; height:16px; border-radius:50%;
    background:var(--green); border:2px solid var(--card); margin-top:-6px; cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:16px; height:16px; border-radius:50%;
    background:var(--green); border:2px solid var(--card); cursor:pointer;}
  /* 근거·사주 */
  .ev{border-left:3px solid var(--green-soft); padding:6px 10px; margin:8px 0; font-size:12.8px;
    background:var(--paper); border-radius:0 10px 10px 0;}
  .ev b{font-family:'Gowun Batang',serif; color:var(--green);}
  /* 종합 결과. 심화 리딩의 최종 페이로드라 다른 카드보다 승격해서 보여줌
     (.ev와 같은 green-soft/left-accent 어휘를 재사용, 새 색은 안 씀) */
  .card.hero{background:var(--green-soft); border-color:var(--green); position:relative;
    padding-left:19px; overflow:hidden;}
  .card.hero::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:var(--green);}
  .card.hero h3.sec{font-size:17px; margin-top:0;}
  .grade{display:inline-block; border:1px solid var(--green); color:var(--green); border-radius:99px;
    padding:3px 12px; font-size:12.5px; font-weight:700; background:var(--green-soft);}
  .pillars{display:flex; gap:6px; justify-content:center; margin:10px 0 6px;}
  .pillar{flex:1; max-width:86px; border:1px solid var(--line); border-radius:10px; background:var(--paper);
    padding:10px 4px 8px; text-align:center;}
  .pillar .pl{font-size:10.5px; color:var(--sub); margin-bottom:4px;}
  .pillar .pj{font-family:'Gowun Batang',serif; font-size:27px; font-weight:700; line-height:1.32;}
  .pillar .pk{font-size:10px; color:var(--sub); margin-top:4px; letter-spacing:.04em;}
  .ebar{display:flex; align-items:center; gap:6px; font-size:12px; margin-top:4px;}
  .ebar .en{width:34px;}
  .ebar .et{flex:1; height:8px; background:var(--paper); border:1px solid var(--line); border-radius:99px; overflow:hidden;}
  .ebar .ef{display:block; height:100%;}
  .atbox{border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-top:8px; background:var(--paper); font-size:13px;}
  .atbox b{color:var(--green);}
  .atbox .shadow{color:var(--sub);}
  /* 궁합 */
  .verdict{text-align:center; padding:16px;}
  .verdict h2{font-family:'Gowun Batang',serif; font-size:25px; margin:6px 0;}
  /* 보관함 */
  .arc-item{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:13px 14px; margin-bottom:10px; display:flex; align-items:center; gap:10px;}
  .arc-item .seal{width:10px; height:10px; border-radius:50%; background:var(--green); flex:0 0 auto;}
  .arc-item .info{flex:1; font-size:13.5px;}
  .arc-item .info small{display:block; color:var(--sub); font-size:12px;}
  .arc-empty{text-align:center; color:var(--sub); font-size:13px; padding:36px 0;}
  .arc-view{border:none; background:none; color:var(--green); font-size:12px; font-weight:700; cursor:pointer;
    text-decoration:underline; text-decoration-color:transparent; transition:text-decoration-color .12s ease-out, opacity .12s ease-out;}
  .arc-del{border:none; background:none; color:var(--red); font-size:12px; cursor:pointer;
    text-decoration:underline; text-decoration-color:transparent; transition:text-decoration-color .12s ease-out, opacity .12s ease-out;}
  .arc-view:hover, .arc-del:hover{text-decoration-color:currentColor;}
  .arc-view:active, .arc-del:active{opacity:.6;}
  .legend{font-size:11.5px; color:var(--sub); margin:16px 0 6px; text-align:center;}
  #toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(10px);
    background:var(--ink); color:var(--card); font-size:13px; padding:9px 16px; border-radius:99px;
    opacity:0; pointer-events:none; transition:.25s; z-index:50; max-width:88%; text-align:center;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .cf-overlay{position:fixed; inset:0; background:rgba(60,53,42,.35); display:flex; align-items:center;
    justify-content:center; z-index:80; padding:20px;}
  .cf-box{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px 18px 16px; max-width:320px; width:100%; text-align:center;}
  .cf-box p{margin:0 0 14px; font-size:14px; line-height:1.5;}
  #installBanner{position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line);
    padding:10px 16px; display:none; align-items:center; gap:10px; z-index:60; font-size:13px; color:var(--ink);
    padding-bottom:calc(10px + env(safe-area-inset-bottom));}
  #installBanner.show{display:flex;}
  #installBanner span{flex:1; line-height:1.4;}
  #installBanner button{border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:10px;
    padding:7px 12px; font:inherit; font-size:12.5px; cursor:pointer; white-space:nowrap;}
  #installBanner button.go{background:var(--green); border-color:var(--green); color:var(--paper); font-weight:700;}
</style>
</head>
<body>
<div id="splashScreen"><img src="./icon-512.png?v=e-icon" alt=""></div>
<div id="landingScreen">
  <div class="lTitle">당신의 연애는<br>어떤 모습을 하고 있을까요?<br><br><b>MBTI</b>와 <b>사주</b>로 읽는<br>나만의 연애 유형</div>
  <div class="lTap">화면을 터치해 시작하기</div>
</div>
<header class="wrap">
  <button class="theme-toggle" id="themeToggle"></button>
  <h1>Type Readings<span class="dot">.</span></h1>
  <p>재미로 보는 나의 연애 유형 · 사주와 MBTI로 읽는 심화 리딩</p>
  <span class="disclaimer">※ 본 결과는 재미로 보는 셀프 리딩이에요</span>
</header>
<nav><div class="tabs" id="tabs"></div></nav>
<main class="wrap" id="main"></main>
<div id="toast"></div>
<div id="installBanner"></div>

<script>
/* ══════════ 데이터 ══════════ */
const AXES=[
 {name:'표현', front:'직진', back:'신중'},
 {name:'온도', front:'불꽃', back:'잔잔'},
 {name:'판단', front:'낭만', back:'현실'}
];
/* 축별 MBTI 힌트 소스 표기 (근거문용) */
const MBTI_SRC=['E-I','S-N','T-F·J-P'];
/* 문항: ax 0~2 = 축, 'S1'~'S4' = 시그널. 보기 [앞성향, 중간, 뒷성향]. 라벨은 UI에 노출하지 않음 */
const QS=[
 {ax:0,t:'단톡방에서 자꾸 눈이 가는 사람이 생겼다.',o:['보통은 먼저 개인톡을 걸어보는 편이다','단톡방 안에서 반응을 주고받으며 간을 보는 편이다','일단은 지켜보며 마음부터 정리하는 편인 것 같다']},
 {ax:0,t:'썸 상대가 3일 잠수 후 "미안, 바빴어"라며 연락이 왔다.',o:['"연락 기다렸잖아"라고 솔직하게 말하는 편이다','가볍게 받아주되 서운함은 살짝 티 내는 편이다','아무렇지 않은 척하고 속으로만 정리하는 편이다']},

/* 정서 안정도(A/T) 읽기 — 퍼센티지 + 일주(일간·배우자궁 오행 관계)를
   함께 반영해 재구성(2026-07-27 사용자 피드백). 중립 구간을 55~45%에서
   60~40%로 넓힘 — 55%를 "T 우세"로 단정짓기엔 애매하다는 지적 반영,
   그 구간에선 완전 중립은 아니되 "중립 성향"으로만 언급한다.
   CLAUDE.md 규칙상 A/T는 3축 판정에는 여전히 쓰지 않음, 이 카드
   서술에만 반영. */
function atRelFlavor(sj){
 const rel=ohangRel(sj.dayEl, JEL[JI[sj.pillars[2].j]]);
 if(rel.startsWith('bihwa'))return '일주로 보면 일간과 배우자궁(일지)의 오행이 같아서, 안과 밖의 감정 온도가 비교적 일정하게 흘러가는 편이에요.';
 if(rel==='A_saeng_B')return '일주로 보면 일간이 배우자궁(일지)을 생(生)하는 관계라, 스스로 정서적 자원을 자꾸 내어주는 흐름이 있어요. 다독임이 습관이 되면 정작 나를 챙기는 게 뒤로 밀릴 수 있어요.';
 if(rel==='B_saeng_A')return '일주로 보면 배우자궁(일지)이 일간을 생(生)해주는 관계라, 마음 한켠에 기댈 곳이 있는 느낌으로 감정을 다스리는 편이에요.';
 if(rel==='A_geuk_B')return '일주로 보면 일간이 배우자궁(일지)을 극(剋)하는 관계라, 감정을 눌러두었다가 한 번에 터뜨리는 경향이 있을 수 있어요.';
 return '일주로 보면 배우자궁(일지)이 일간을 극(剋)하는 관계라, 관계 안의 크고 작은 긴장이 감정 기복의 자극제가 되기 쉬워요.';
}
// 정서 안정도(A/T) 퍼센트로 밝은 면·그림자 양면 서술을 만든다. 40~60%는 기운 방향까지 말하는 중립으로 본다
function atReading(pct,sj){
 const flavor=atRelFlavor(sj);
 if(pct>=60)return{name:'T(격동) 성향 우세',
   light:'섬세한 감수성과 깊은 공감, 관계를 더 좋게 만들려는 성장 동력이 강점이에요.',
   shadow:'다만 확인 욕구와 자기검열로 스스로 지치거나, 상대의 무심한 순간을 실제보다 크게 해석할 수 있어요. '+flavor};
 if(pct<=40)return{name:'A(안정) 성향 우세',
   light:'감정 회복이 빠르고 관계에 여유와 안정감을 줘요. 담백한 신뢰가 강점이에요.',
   shadow:'다만 그 무던함이 상대에게는 무심함으로 보일 수 있고, 상대의 불안 신호를 "별일 아니겠지" 하고 지나칠 수 있어요. '+flavor};
 const lean=pct>50?'격동 쪽으로 살짝 기운 중립 성향':pct<50?'안정 쪽으로 살짝 기운 중립 성향':'안정과 격동이 고르게 섞인 중립 성향';
 return{name:lean,
   light:'상황에 따라 안정과 섬세함을 오가는 균형형이에요. 여유와 공감을 모두 꺼내 쓸 수 있어요.',
   shadow:'다만 컨디션에 따라 반응이 달라져, 상대가 내 상태를 예측하기 어려워할 수 있어요. '+flavor};
}

 l:['마음이 확실해지면 관계에서도 리드하는 쪽을 자연스럽게 맡아요','좋아하는 티를 숨기기보다 행동으로 먼저 보여주는 편이에요','한번 마음을 주면 쉽게 흔들리지 않고 꾸준히 향하는 스타일이에요','상대가 자신의 방향을 믿고 따라와 줄 때 가장 크게 빛나요'],

 을:{name:'을목(乙)',catch:'"부드럽지만 끝내 살아남는 덩굴"',

// 양력 날짜를 율리우스 적일(JDN)로 바꾼다 (일주 계산용)
function jdn(y,m,d){const a=Math.floor((14-m)/12),y2=y+4800-a,m2=m+12*a-3;
 return d+Math.floor((153*m2+2)/5)+365*y2+Math.floor(y2/4)-Math.floor(y2/100)+Math.floor(y2/400)-32045;}
function ymdFromJdn(J){ /* jdn()의 역함수 */
 const f=J+1401+Math.floor(Math.floor((4*J+274277)/146097)*3/4)-38;
 const e=4*f+3, g=Math.floor((e%1461)/4), h2=5*g+2;
 const D=Math.floor((h2%153)/5)+1, M=((Math.floor(h2/153)+2)%12)+1;
 const Y=Math.floor(e/1461)-4716+Math.floor((14-M)/12);
 return {y:Y,m:M,d:D};
}
const TERMS=[[2,4],[3,6],[4,5],[5,6],[6,6],[7,7],[8,8],[9,8],[10,8],[11,7],[12,7]]; /* 인~자월 절입(근사) */
function nearBoundary(m,d){ /* 절기 경계 ±1일 여부 */
 const all=TERMS.concat([[1,6]]);
 return all.some(([tm,td])=>m===tm&&Math.abs(d-td)<=1);
}
const HOUR_CORR=-30; /* 지방시 보정(전국 일괄 근사, 분), 표준시(KST) 기준 시각에서 뺀다 */
function nearHourBoundary(mins){ /* 지방시 보정 후 시진 경계(KST 기준 약 매 홀수시:30분) 근접(±15분) 여부 */
 const marks=[90,210,330,450,570,690,810,930,1050,1170,1290,1410];
 return marks.some(mk=>Math.abs(mins-mk)<=15);
}
// 생년월일시로 사주 4기둥(연·월·일·시주)과 오행 개수를 계산한다. 절기는 근사, 지방시는 전국 일괄 보정
function saju(y,m,d,mins){ /* mins: 그날 0~1439(KST, 시*60+분) 또는 null(시각 모름) */
 let ey=y,em=m,ed=d, hj=null,hg=null,corrMin=null;
 if(mins!==null){
   corrMin=mins+HOUR_CORR;
   if(corrMin<0){ corrMin+=1440; const g=ymdFromJdn(jdn(y,m,d)-1); ey=g.y; em=g.m; ed=g.d; }
 }
 const ge=(mm,dd)=>(em>mm)||(em===mm&&ed>=dd);
 const sy=ge(2,4)?ey:ey-1;
 const yg=((sy-4)%10+10)%10, yj=((sy-4)%12+12)%12;
 let mi; /* 0=인월 */
 if(em===1) mi=ed>=6?11:10;
 else if(em===2&&ed<4) mi=11;
 else{ mi=0; for(let k=0;k<TERMS.length;k++){ if(ge(TERMS[k][0],TERMS[k][1])) mi=k; } }
 const mg=(((yg%5)*2+2)+mi)%10, mj=(2+mi)%12;
 const di=((jdn(ey,em,ed)+49)%60+60)%60;
 const dg=di%10, dj=di%12;
 if(corrMin!==null){ hj=Math.floor(((corrMin+60)%1440)/120); hg=(((dg%5)*2)+hj)%10; }
 const pillars=[{l:'연주',g:yg,j:yj},{l:'월주',g:mg,j:mj},{l:'일주',g:dg,j:dj}];
 if(mins!==null) pillars.push({l:'시주',g:hg,j:hj});
 const cnt={'목':0,'화':0,'토':0,'금':0,'수':0};
 pillars.forEach(p=>{cnt[GEL[p.g]]++; cnt[JEL[JI[p.j]]]++;});
 return {pillars,cnt,dayGan:dg,yinYang:dg%2===0?'양':'음',dayEl:GEL[dg],
   hourKnown:mins!==null,boundary:nearBoundary(em,ed),
   hourBoundary:mins!==null&&nearHourBoundary(mins),
   dayShifted:mins!==null&&(ey!==y||em!==m||ed!==d)};
}
/* ══════════ 십성(十星), 지장간 포함 (2026-07-26 신설) ══════════

   오(午)의 기토, 해(亥)의 무토 포함 여부 등은 문헌마다 이견이 있어
   "간이 계산" 범주로 취급. 정기(배열 마지막 원소)만 십성 판단에 사용. */
const JIJANGGAN=[[8,9],[9,7,5],[4,2,0],[0,1],[1,9,4],[4,6,2],[2,5,3],[3,1,5],[4,8,6],[6,7],[7,3,4],[4,0,8]];

const SIB_SAENG={목:'화',화:'토',토:'금',금:'수',수:'목'};
const SIB_KE={목:'토',화:'금',토:'수',금:'목',수:'화'};
// 일간 기준으로 다른 천간의 십성 이름을 구한다
function sibsung(dayGanIdx,otherGanIdx){
 const dEl=GEL[dayGanIdx], oEl=GEL[otherGanIdx];
 const same=(dayGanIdx%2)===(otherGanIdx%2);
 if(oEl===dEl) return same?'비견':'겁재';
 if(SIB_SAENG[dEl]===oEl) return same?'식신':'상관';
 if(SIB_SAENG[oEl]===dEl) return same?'편인':'정인';
 if(SIB_KE[dEl]===oEl) return same?'편재':'정재';
 return same?'편관':'정관';
}
// 십성 이름을 다섯 그룹(비겁·식상·재성·관성·인성)으로 묶는다
function sibsungGroup(name){
 if(name==='비견'||name==='겁재')return '비겁';
 if(name==='식신'||name==='상관')return '식상';
 if(name==='편재'||name==='정재')return '재성';
 if(name==='편관'||name==='정관')return '관성';
 return '인성';
}
// 사주 여덟 자리(지지는 지장간까지)의 십성 목록을 만든다
function sibsungSlots(sj){
 /* 지지는 지장간(여기·중기·정기)을 전부 반영, 한 글자(정기)만 볼 때보다
    사주팔자 전체 안에서의 많고 적음을 훨씬 온전하게 판단할 수 있다 */
 const dg=sj.dayGan; const slots=[];
 const add=(label,ganIdx)=>{const s=sibsung(dg,ganIdx);slots.push({label,ganIdx,s,g:sibsungGroup(s)});};
 add('연간',sj.pillars[0].g); JIJANGGAN[sj.pillars[0].j].forEach(gi=>add('연지',gi));
 add('월간',sj.pillars[1].g); JIJANGGAN[sj.pillars[1].j].forEach(gi=>add('월지',gi));
 JIJANGGAN[sj.pillars[2].j].forEach(gi=>add('일지',gi));
 if(sj.pillars[3]){ add('시간',sj.pillars[3].g); JIJANGGAN[sj.pillars[3].j].forEach(gi=>add('시지',gi)); }
 return slots;
}

function yinYangBalance(sj){
 let yang=0,eum=0;
 sj.pillars.forEach(p=>{ (p.g%2===0)?yang++:eum++; (p.j%2===0)?yang++:eum++; });
 return {yang,eum};
}

 const vals=['비겁','식상','재성','관성','인성'];

 return vals[cnts.indexOf(Math.max(...cnts))];
}
// 두 사람의 최다 그룹이 서로 채워 주는 관계인지 판정한다
function complementCheck(topA,topB){
 const aNeedsB=COMPLEMENT_GROUP[topA]===topB, bNeedsA=COMPLEMENT_GROUP[topB]===topA;
 if(aNeedsB&&bNeedsA)return 'mutual';
 if(aNeedsB||bNeedsA)return 'oneway';
 if(topA===topB)return 'same';
 return 'none';
}
// 사주 궁합: 일간 오행 상생상극, 배우자궁 합충, 음양 비교, 십성 상호보완 네 축으로 서술한다
function sajuCompat(sjA,sjB){
 const rel=ohangRel(sjA.dayEl,sjB.dayEl);
 const jiRel=jiRelation(sjA.pillars[2].j,sjB.pillars[2].j);
 const ycA=yinYangClass(sjA), ycB=yinYangClass(sjB);
 const yyRel=(ycA==='yang'&&ycB==='yang')||(ycA==='eum'&&ycB==='eum')?'sameDir':
   ((ycA==='yang'&&ycB==='eum')||(ycA==='eum'&&ycB==='yang'))?'oppositeDir':'mixed';
 const topA=topGroupOf(groupCntOf(sjA)), topB=topGroupOf(groupCntOf(sjB));
 const compRel=complementCheck(topA,topB);
 let pos=0;
 if(rel==='A_saeng_B'||rel==='B_saeng_A')pos++;
 if(jiRel==='hap')pos++;
 if(yyRel==='oppositeDir')pos++;
 if(compRel==='mutual')pos+=2; else if(compRel==='oneway')pos++;
 const grade=pos>=4?'좋은 인연':pos>=2?'무난한 인연':'노력이 필요한 인연';
 const B=(label,text)=>'<b>'+label+'</b> · '+text;
 return [grade,[
   B('일간 오행 궁합',OHANG_TXT[rel]),
   B('배우자궁(일지) 합충',JI_REL_TXT[jiRel]),
   B('음양 궁합',YY_TXT[yyRel]),
   B('오행·십성 상호보완',COMP_TXT[compRel])
 ]];
}
/* 사주 → 축 힌트: [표현, 온도, 판단] 1=앞, 0=뒤, null=힌트 없음 */
function sajuHints(sj){
 const h=[null,null,null];
 h[0]=sj.yinYang==='양'?1:0;
 if(sj.dayEl==='화')h[1]=1; else if(sj.dayEl==='수'||sj.dayEl==='토')h[1]=0;
 if(sj.dayEl==='목')h[2]=1; else if(sj.dayEl==='금')h[2]=0;
 return h;
}
/* MBTI 슬라이더 → 축 힌트. sl={EI,SN,TF,JP,AT} 값=오른쪽 글자 쪽 % */
function mbtiHints(sl){
 const h=[null,null,null];
 if(sl.EI<=45)h[0]=1; else if(sl.EI>=55)h[0]=0;      /* E=직진 */
 if(sl.SN>=55)h[1]=1; else if(sl.SN<=45)h[1]=0;      /* N=불꽃 / S=잔잔 */
 let tf=null,jp=null;
 if(sl.TF>=55)tf=1; else if(sl.TF<=45)tf=0;          /* F=낭만 */
 if(sl.JP>=55)jp=1; else if(sl.JP<=45)jp=0;          /* P=낭만 */
 h[2]=tf===null?jp:(jp===null?tf:(tf===jp?tf:null));  /* T-F 주 + J-P 보조, 엇갈리면 중립 */
 return h;
}
function atState(sl){ return sl.AT>=55?'T':(sl.AT<=45?'A':'M'); }
function domPct(pair,val){ /* pair='EI' 등, val=오른쪽 글자(pair[1])의 %, 더 큰 쪽 글자·퍼센트를 표기 */
 const left=100-val, right=val;
 return right>=left ? pair[1]+right+'%' : pair[0]+left+'%';
}
function mbtiStrengthLine(D){
 return 'MBTI 발화 강도: '+domPct('EI',D.EI)+' · '+domPct('SN',D.SN)+' · '+domPct('TF',D.TF)+' · '+domPct('JP',D.JP)+' · '+domPct('AT',D.AT);
}
function intensityWord(pct){ /* pct: 우세 쪽 %(55~100), 극단적인지/사잇값인지에 따라 표현 차등 */
 if(pct>=85)return '매우 강하게';
 if(pct>=70)return '뚜렷하게';
 return '약간';
}
function mbtiStrengthOf(i,sl){ /* 해당 축 힌트를 만든 지표의 우세 %, 판정근거 강도 표현용 */
 if(i===0)return Math.max(sl.EI,100-sl.EI);
 if(i===1)return Math.max(sl.SN,100-sl.SN);
 const tfKnown=sl.TF<=45||sl.TF>=55;
 return tfKnown?Math.max(sl.TF,100-sl.TF):Math.max(sl.JP,100-sl.JP);
}

function resolveAxis(i, bDir, bScore, mH, sH, recAns, mStr){
 /* 반환 {dir, status, needRec, lines[]}, status: agree|ignite|adjust|explore */
 const L=[];const ax=AXES[i];

 else L.push('19개 문항 중 이 축에 해당하는 응답을 보면, \''+dn(bDir)+'\' 쪽으로 5점 만점에 '+bScore+'점이 나와서 행동상으로는 뚜렷하게 '+dn(bDir)+' 성향을 보였어요.');
 if(recAns){ /* 재확인 완료 후 최종 판정 */
   const rSum=recAns[0]+recAns[1];
   let rDir = rSum>=2?1:(rSum<=0?0:null);
   if(rDir===null){ rDir = bDir==='sw' ? null : bDir; }
   let vote=0;
   if(rDir!==null)vote+=(rDir===1?2:-2);
   if(mH!==null)vote+=(mH===1?1:-1);
   if(sH!==null)vote+=(sH===1?1:-1);
   let dir,status;
   if(vote>0){dir=1;status='adjust';}
   else if(vote<0){dir=0;status='adjust';}
   else{dir=bDir==='sw'?1:bDir;status='explore';}
   if(sH!==null&&sH!==dir&&status==='adjust')status='ignite';
   L.push('소스들이 엇갈려서 한 번 더 물어본 재확인 문항에서는 '+(rDir===null?'답이 정확히 반반으로 갈렸어요':'\''+dn(rDir)+'\' 쪽으로 답해주셨어요')+'. 여기에 행동 응답에 가중치 2, MBTI·사주에 각각 가중치 1을 두고 합산한 결과, 최종적으로 \''+dn(dir)+'\'로 확정했어요.');

 }
 if(bDir!=='sw'){
   const mAg=mH===null||mH===bDir, sAg=sH===null||sH===bDir;
   L.push(mH===null?'MBTI 지표('+MBTI_SRC[i]+')는 두 성향이 팽팽해 중립 범위였어요. 그래서 후천적인 힌트는 따로 없었어요.'
     :'MBTI 지표('+MBTI_SRC[i]+')에서도 '+intensityWord(mStr)+'('+mStr+'%) \''+dn(mH)+'\' 쪽으로 기울어 있어서, 후천적으로도 '+dn(mH)+' 성향이 발화되고 있다고 볼 수 있어요.');
   L.push(sH===null?'이 축에 대응하는 오행 힌트는 없어서, 사주 쪽에서는 특별히 참고할 방향이 없었어요.'
     :'사주에서는 일간의 기운이 \''+dn(sH)+'\' 쪽 모습을 타고났다고 해석했어요.');
   if(mAg&&sAg){L.push('행동·MBTI·사주 세 소스가 모두 같은 방향을 가리켜서, \''+dn(bDir)+'\'로 확정했어요.');return {dir:bDir,status:'agree',needRec:false,lines:L};}
   if(mH===bDir&&sH!==null&&sH!==bDir){L.push('타고난 사주의 모습과는 다른 방향이 지금 행동과 MBTI로 발화되고 있는 셈이에요. 지금 뚜렷하게 드러나는 모습을 기준으로 \''+dn(bDir)+'\'로 판단했어요.');return {dir:bDir,status:'ignite',needRec:false,lines:L};}
   L.push('이렇게 소스들의 방향이 서로 엇갈려서, 바로 결론 내리기보다 한 번 더 확인하는 문항으로 최종 방향을 정하기로 했어요.');
   return {dir:bDir,status:'rec',needRec:true,lines:L};
 }else{
   L.push(mH===null?'MBTI 지표('+MBTI_SRC[i]+')도 중립 범위라 후천적인 힌트는 없었어요.'
     :'MBTI 지표('+MBTI_SRC[i]+')에서 '+intensityWord(mStr)+'('+mStr+'%) \''+dn(mH)+'\' 쪽 힌트가 나왔어요.');
   L.push(sH===null?'이 축에 대응하는 사주 힌트도 따로 없었어요.'

   if(mH!==null&&sH!==null&&mH===sH){L.push('행동으로는 판단이 어려웠지만, MBTI와 사주가 똑같이 \''+dn(mH)+'\' 쪽을 가리키고 있어서 이 방향으로 확정했어요.');return {dir:mH,status:'adjust',needRec:false,lines:L};}

   if(sH!==null&&mH===null){L.push('행동으로는 판단이 어려웠지만, 사주에서 타고난 \''+dn(sH)+'\' 쪽 모습이 뚜렷해서 이 방향으로 확정했어요.');return {dir:sH,status:'adjust',needRec:false,lines:L};}

// 심화 리딩 판정 엔진: 행동(문항)·후천(MBTI)·선천(사주) 근거를 축마다 모아 최종 방향을 정한다
function runEngine(withRec){
 const qr=quickResult();
 const sj=saju(S.deep.y,S.deep.mo,S.deep.d,S.deep.hKnown?(S.deep.hh*60+S.deep.mm):null);
 const sH=sajuHints(sj), mH=mbtiHints(S.deep);
 const res=[],need=[];
 for(let i=0;i<3;i++){
   const ra=withRec&&S.recAns[i]?S.recAns[i]:null;
   const r=resolveAxis(i,qr.dir[i],qr.sc[i],mH[i],sH[i],ra,mbtiStrengthOf(i,S.deep));
   res.push(r); if(r.needRec)need.push(i);
 }
 /* 피드백 "글쎄요" → 가장 확신 낮은 축 추가 재확인 */
 if(S.fb===2&&need.length===0&&!withRecDone()){
   let weak=0,wv=99;
   qr.sc.forEach((s,i)=>{const d=Math.abs(s-2.5);if(d<wv){wv=d;weak=i;}});
   if(!need.includes(weak))need.push(weak);
   res[weak].needRec=true;res[weak].status='rec';
   res[weak].lines.push('→ 피드백("글쎄요")을 반영해 이 축을 한 번 더 확인해요');
 }
 return {qr,sj,res,need};
 function withRecDone(){return Object.keys(S.recAns).length>0;}
}
// 축별 판정 상태로 종합 등급(탐색형 등)과 설명을 정한다
function gradeOf(res){
 if(res.some(r=>r.status==='explore'))return ['탐색형','지금은 스스로를 알아가는 구간이에요. 소스들이 서로 다른 이야기를 하는 건, 그만큼 <b>여러 모습을 가졌다는 뜻</b>이기도 해요.'];
 if(res.every(r=>r.status==='agree'))return ['일관형','선천·후천·행동이 <b>같은 방향을 가리켜요</b>. 스스로에 대한 감각이 꽤 정확한 편이에요.'];

// MBTI × 사주 문단: 축별 판정 근거가 같은 방향인지 다시 읽어 준다
function mbtiSajuFusionText(res){
 /* MBTI(후천)와 사주(선천)가 축별로 실제로 같은 방향인지, 다른 방향인지를
    판정근거(res[i].status)에서 그대로 가져와 서술, 별개로 지어내는
    문장이 아니라 이미 계산된 근거를 "MBTI×사주" 관점으로 다시 읽어주는 것.
    같은 결론(status)에 묶이는 축이 여럿이면 한 문장으로 합쳐서 서술한다
    (2026-07-27 사용자 피드백 — 3축이 전부 같은 status일 때 똑같은 문장이
    3번 반복돼 가독성이 떨어지고 성의없어 보인다는 지적으로 개선) */
 const BODY={
   agree:'MBTI(후천)와 사주(선천)가 <b>같은 방향</b>을 가리켜요. 타고난 기질과 지금 발달시킨 성향이 서로 뒷받침하고 있어요.',
   ignite:'사주가 타고난 모습과 지금 MBTI로 드러나는 모습이 <b>달라요</b>. 원래 성향과는 다른 방향으로 후천적인 변화가 생긴 축이에요.',
   other:'MBTI와 사주가 <b>서로 다른 이야기</b>를 하고 있어요. 아직 스스로도 여러 모습을 오가며 시험해보는 중일 수 있어요.'
 };
 const buckets={agree:[],ignite:[],other:[]};
 res.forEach((r,i)=>{
   const key=r.status==='agree'?'agree':r.status==='ignite'?'ignite':'other';
   buckets[key].push(AXES[i].name);
 });
 return ['agree','ignite','other'].map(k=>{
   const names=buckets[k];
   if(!names.length)return null;
   const label='<b>'+names.join('·')+'축</b>'+(names.length>1?'은 모두 ':'은 ');
   return label+BODY[k];
 }).filter(Boolean).join('<br><br>');
}

   터치는 무시해 MBTI 슬라이더 드래그 등과 충돌하지 않게 함 */
(function(){
 let sx=null, sy=null, starget=null;
 const ignoreTags=['INPUT','SELECT','BUTTON','A','TEXTAREA','LABEL'];
 mainEl.addEventListener('touchstart',e=>{
   sx=e.touches[0].clientX; sy=e.touches[0].clientY; starget=e.target;
 },{passive:true});
 mainEl.addEventListener('touchend',e=>{
   if(sx===null)return;
   const tag=(starget&&starget.tagName)||'';
   if(ignoreTags.includes(tag)||(starget&&starget.closest&&starget.closest('input,select,button,a,details'))){sx=null;return;}
   const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
   if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){
     if(dx<0&&S.tab<TABS.length-1){S.tab++;save();render();scrollTo({top:0});}
     else if(dx>0&&S.tab>0){S.tab--;save();render();scrollTo({top:0});}
   }
   sx=null;
 },{passive:true});
})();

// 심화 리딩 결과를 TXT 파일로 내려받는다
function downloadTxt(key,grade,eng){
 const T=TYPES[key];const L=[];
 L.push('══════════════════════');
 L.push(' 연애 유형 심화 리딩');
 L.push(' '+new Date().toLocaleString('ko-KR'));
 L.push('══════════════════════');
 L.push('');L.push('유형: '+T.no+' '+T.name+' ('+T.axes+')');
 L.push('한 줄: '+T.catch);
 L.push('태그: '+T.mbti.join('·')+' 감성 / '+T.zo.split(' (')[0]+', '+ELFEEL[T.el]+'의 기운');
 L.push('일관성 등급: '+grade);
 L.push('');
 ['p','l','t','m'].forEach(c=>{L.push('['+CATN[c]+']');T.rd[c].forEach(b=>L.push(' - '+b));L.push('');});
 L.push('[판정 근거]');
 eng.res.forEach((r,i)=>{L.push(AXES[i].name+'축 → '+(r.dir===1?AXES[i].front:AXES[i].back));r.lines.forEach(l=>L.push('  '+l));});
 L.push('');
 const sj=eng.sj, DS=DAYSTEM[GAN[sj.dayGan]];
 L.push('['+DS.name+' 일간이 말하는 나의 연애 성향]');
 L.push(' '+DS.catch);
 ['p','l','t','m'].forEach(c=>{L.push(' ['+DSCATN[c]+']');DS.rd[c].forEach(b=>L.push('  - '+b));});
 const slots=sibsungSlots(sj);
 const groupCnt={비겁:0,식상:0,재성:0,관성:0,인성:0}; slots.forEach(s=>groupCnt[s.g]++);
 const {yang,eum}=yinYangBalance(sj);
 const IJ=ILJU[GAN[sj.dayGan]+JI[sj.pillars[2].j]];
 L.push(' [일간에 일지까지 더하면, '+GAN[sj.dayGan]+JI[sj.pillars[2].j]+' 일주]'); L.push(' '+IJ.catch);
 ['p','l','t','m'].forEach(c=>{L.push(' ['+DSCATN[c]+']');IJ.rd[c].forEach(b=>L.push('  - '+b));});
 L.push(' [사주팔자의 음양 조화]'); L.push('  - 양(陽) '+yang+' : 음(陰) '+eum); L.push('  - '+yinYangText(sj));
 const {notes:enotes,topGroup}=sibGroupAnalysis(groupCnt);
 L.push(' [오행·십성 분포가 더하는 색깔]'); enotes.forEach(n=>L.push('  - '+n.replace(/<\/?b>/g,'')));
 L.push(' [이런 사람과 잘 어울릴 수 있어요]'); MATCH_TXT[topGroup].forEach(b=>L.push('  - '+b.replace(/<\/?b>/g,'')));
 L.push('');L.push('※ 재미로 보는 콘텐츠 · 사주는 간이 계산');
 const blob=new Blob([L.join('\n')],{type:'text/plain;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='love_type_reading.txt';a.click();URL.revokeObjectURL(a.href);
}

function compat(a,b){

   B('표현 궁합','표현 속도가 완전히 같아서, 밀당 없이 마음이 있는 그대로 전해져요.'),
   B('온도 궁합','연애에서 느끼는 온도도 똑같아서, 뜨겁고 싶을 때 같이 뜨겁고 잔잔하고 싶을 때 같이 잔잔해져요.'),
   B('가치관 궁합','사랑을 바라보는 기준도 같아서, 중요한 결정 앞에서 부딪힐 일이 적어요.'),
   B('이 조합의 강점','설명하지 않아도 통하는, 마치 나 자신과 연애하는 듯한 편안함이 있어요.'),

 ]];

 if(diff===3)return ['환장조합',[

   B('가치관 궁합','사랑을 바라보는 기준까지 달라서, 같은 상황을 완전히 다르게 해석할 때가 많아요.'),
   B('이 조합의 강점','혼자서는 절대 배우지 못했을 태도와 시야를 상대를 통해 채우는, 최고의 성장 조합이 되기도 해요.'),
   B('주의할 점','처음엔 "왜 저렇게 반응하지?" 싶은 순간이 유독 많을 거예요.'),
   B('오래가는 팁','이해하려 애쓰기보다 "저 사람은 원래 저렇구나" 하고 관찰하고 존중하는 태도가 관계의 핵심이에요.')
 ]];
 if(a[0]!==b[0]&&a[1]===b[1]&&a[2]===b[2])return ['꿀조합',[
   B('표현 궁합','다가가는 속도만 달라서, 한쪽이 문을 두드리면 다른 한쪽이 자연스럽게 열어주는 흐름이 만들어져요.'),
   B('온도 궁합','연애에서 느끼는 온도는 완전히 같아서, 둘이 원하는 밀도가 자연스럽게 맞아떨어져요.'),
   B('가치관 궁합','사랑을 바라보는 기준도 같아서, 큰 결정 앞에서 의견이 잘 갈리지 않아요.'),

   B('주의할 점','표현 속도 차이 때문에 다가가는 단계에서는 조금 답답하게 느껴질 수 있어요.'),
   B('오래가는 팁','조급해하지 않고 서로의 속도를 존중해주면, 그 시기만 지나면 서로에게 끌릴 수밖에 없는 궁합이에요.')
 ]];
 return ['무난조합',[

   B('가치관 궁합',a[2]===b[2]?'사랑을 바라보는 기준이 같아서 중요한 결정에서 손발이 잘 맞아요.':'가치관은 다르지만 서로의 세계를 넓혀주는 재료가 돼요.'),
   B('이 조합의 강점','극적인 합도, 극적인 반대도 아닌, 무난하다는 건 그만큼 함께 만들어갈 여지가 많다는 뜻이에요.'),
   B('주의할 점','처음엔 특별할 것 없어 보일 수 있어요.'),
   B('오래가는 팁','다른 부분은 옳고 그름을 따지기보다, 서로 다른 방식이 있다는 걸 인정하는 대화를 가끔 나눠보면 좋아요.')
 ]];
}

   h+='<p class="note" style="margin-top:10px">나의 사주 · 일간 '+GAN[myArc.snap.sj.dayGan]+'('+GANH[myArc.snap.sj.dayGan]+') · '+myArc.snap.sj.dayEl+' 기운 (보관함 최근 심화 리딩 자동 반영)</p>';
 }else{
   h+=birthFld('mb',S.cmpMB,'나의');
 }
 h+=birthFld('pb',S.cmpPB,'상대의');
 h+='<div class="btnrow"><button class="btn primary" id="sajuGo">사주 궁합 확인하기</button></div>';
 if(S.cmpSajuShow){
   const mySj=myArc?myArc.snap.sj:saju(S.cmpMB.y,S.cmpMB.mo,S.cmpMB.d,S.cmpMB.hKnown?(S.cmpMB.hh*60+S.cmpMB.mm):null);
   const partnerSj=saju(S.cmpPB.y,S.cmpPB.mo,S.cmpPB.d,S.cmpPB.hKnown?(S.cmpPB.hh*60+S.cmpPB.mm):null);
   const [sgn,sgb]=sajuCompat(mySj,partnerSj);
   h+='<div class="card verdict" style="margin-top:14px"><span class="tno" style="font-family:\'Gowun Batang\',serif;color:var(--green);font-size:13px;font-weight:700">'+
   GAN[mySj.dayGan]+GANH[mySj.dayGan]+' × '+GAN[partnerSj.dayGan]+GANH[partnerSj.dayGan]+'</span><h2>'+sgn+'</h2>'+
   '<ul class="bl" style="text-align:left">'+sgb.map(b=>'<li>'+b+'</li>').join('')+'</ul>'+
   '<p class="note" style="margin-top:12px;line-height:1.3">※ 사주 궁합도 재미로 보는 콘텐츠예요. 간이 계산 특성상 절기·지방시 경계 부근 출생은 오차가 있을 수 있어요.</p></div>';
 }
 h+='</details>';
 mainEl.innerHTML=h;
 document.getElementById('cmpTypeDetails').ontoggle=e=>{S.cmpTypeOpen=e.target.open;save();};
 document.getElementById('cmpSajuDetails').ontoggle=e=>{S.cmpSajuOpen=e.target.open;save();};
 document.getElementById('cA').onchange=e=>{S.cmpA=e.target.value;S.cmpAAuto=!!(ARC.length&&ARC[0].key===e.target.value);S.cmpShow=false;save();render();};
 document.getElementById('cB').onchange=e=>{S.cmpB=e.target.value;S.cmpShow=false;save();render();};
 document.getElementById('cmpGo').onclick=()=>{S.cmpShow=true;S.cmpTypeOpen=true;save();render();};
 if(!myArc){
   ['mby','mbm','mbd'].forEach(id=>document.getElementById(id).onchange=e=>{
     const v=e.target.value; if(id==='mby')S.cmpMB.y=+v; if(id==='mbm')S.cmpMB.mo=+v; if(id==='mbd')S.cmpMB.d=+v; S.cmpSajuShow=false; save();});
   document.getElementById('mbhh').onchange=e=>{S.cmpMB.hh=+e.target.value;S.cmpSajuShow=false;save();};
   document.getElementById('mbmm').onchange=e=>{S.cmpMB.mm=+e.target.value;S.cmpSajuShow=false;save();};
   document.getElementById('mbUnknown').onchange=e=>{S.cmpMB.hKnown=!e.target.checked;S.cmpSajuShow=false;save();render();};
 }
 ['pby','pbm','pbd'].forEach(id=>document.getElementById(id).onchange=e=>{
   const v=e.target.value; if(id==='pby')S.cmpPB.y=+v; if(id==='pbm')S.cmpPB.mo=+v; if(id==='pbd')S.cmpPB.d=+v; S.cmpSajuShow=false; save();});
 document.getElementById('pbhh').onchange=e=>{S.cmpPB.hh=+e.target.value;S.cmpSajuShow=false;save();};
 document.getElementById('pbmm').onchange=e=>{S.cmpPB.mm=+e.target.value;S.cmpSajuShow=false;save();};
 document.getElementById('pbUnknown').onchange=e=>{S.cmpPB.hKnown=!e.target.checked;S.cmpSajuShow=false;save();render();};

/* ── 보관함 ── */
function renderArc(){
 if(S.arcView!==null&&ARC[S.arcView]){renderArcDetail(ARC[S.arcView]);return;}
 let h='<div class="sec-intro"><b>보관함</b><br>담아둔 결과가 쌓여요. 기록은 이 기기·이 브라우저에만 저장돼요.</div>';
 if(!ARC.length){h+='<div class="arc-empty">아직 담긴 결과가 없어요.<br>진단을 마치고 「보관하기」를 눌러보세요.</div>';mainEl.innerHTML=h;return;}
 mainEl.innerHTML=h;
 ARC.forEach((r,i)=>{
   const T=TYPES[r.key];const d=new Date(r.ts);
   const el=document.createElement('div');el.className='arc-item';
   el.innerHTML='<span class="seal"></span><span class="info"><b>'+T.name+'</b> · '+r.kind+(r.grade?' · '+r.grade:'')+
   '<small>'+d.toLocaleString('ko-KR')+'</small></span>'+
   (r.snap?'<button class="arc-view" data-i="'+i+'">다시보기</button>':'')+
   '<button class="arc-del" data-i="'+i+'">삭제</button>';
   const vb=el.querySelector('.arc-view');
   if(vb)vb.onclick=()=>{S.arcView=i;save();render();scrollTo({top:0});};
   el.querySelector('.arc-del').onclick=()=>{customConfirm('이 기록을 삭제할까요?',()=>{ARC.splice(i,1);saveArc();render();});};
   mainEl.appendChild(el);
 });
}
// 보관함에서 고른 기록을 저장 당시 스냅샷 그대로 다시 보여 준다
function renderArcDetail(r){
 let h='<div class="sec-intro" style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">'+
 '<span><b>보관함 · 다시보기</b><br>'+new Date(r.ts).toLocaleString('ko-KR')+' 저장</span>'+
 '<span id="arcBack" style="color:var(--green);font-weight:700;cursor:pointer;white-space:nowrap">목록으로</span></div>';
 if(r.kind==='1차'){
   h+=typeCard(r.key,{switchAxes:r.sw});
   h+='<div class="card"><h3 class="sec" style="margin-top:0">축 리딩</h3>';
   r.snap.dir.forEach((d,i)=>{const s=r.snap.sc[i];
     h+='<div class="axisline"><b>'+AXES[i].name+'축</b> · '+
     (d==='sw'?'스위치 (딱 절반씩!)':(d===1?AXES[i].front:AXES[i].back)+' '+(d===1?s:5-s)+'/5')+'</div>';});
   h+='</div>';
   if(r.snap.sig.length||r.snap.fx){
     h+='<div class="card"><h3 class="sec" style="margin-top:0">연애 스타일 노트</h3>';
     r.snap.sig.forEach(s=>{h+='<div class="sig"><b>'+s[0]+'</b><br>'+s[1]+'</div>';});
     if(r.snap.fx)h+='<div class="sig"><b>유연 지표</b><br>'+r.snap.fx+'</div>';
     h+='</div>';
   }
 }else{
   const sj=r.snap.sj, D=r.snap.deep, AT=atReading(D.AT,sj);
   h+='<div class="card hero"><h3 class="sec" style="margin-top:0">종합 결과: '+r.grade+'</h3>'+
   '<p style="font-size:13.5px">'+synthesisText(r.key,r.snap.gdesc,sj,D)+'</p></div>';
   h+='<div class="card"><h3 class="sec" style="margin-top:0">MBTI × 사주, 함께 보면</h3>'+
   '<p style="font-size:13.5px">'+mbtiSajuFusionText(r.snap.res)+'</p></div>';
   h+='<details class="card"><summary class="sec">판정 근거</summary>';
   r.snap.res.forEach((rr,i)=>{h+='<div class="ev"><b>'+AXES[i].name+'축 → '+(rr.dir===1?AXES[i].front:AXES[i].back)+'</b><br>'+rr.lines.map(esc).join(' ')+'</div>';});
   h+='<p class="note">'+mbtiStrengthLine(D)+'</p></details>';
   h+='<div class="orient-note"><span>종합적인 판단으로 본 당신의 연애 유형</span></div>';
   h+=typeCard(r.key,{});
   h+='<details class="card"><summary class="sec">'+AT.name+'('+D.AT+'%) 정서 안정도</summary>'+
   '<div class="atbox"><b>밝은 면</b> · '+AT.light+'<br><span class="shadow"><b style="color:var(--red)">그림자</b> · '+AT.shadow+'</span></div></details>';
   h+='<div class="card"><h3 class="sec" style="margin-top:0">나의 사주 (간이)</h3><div class="pillars">'+
   sj.pillars.slice().reverse().map(p=>'<div class="pillar"><div class="pl">'+p.l+'</div>'+
     '<div class="pj" style="color:var('+ELEM[GEL[p.g]]+')">'+GANH[p.g]+'</div>'+
     '<div class="pj" style="color:var('+ELEM[JEL[JI[p.j]]]+')">'+JIH[p.j]+'</div>'+
     '<div class="pk">'+GAN[p.g]+JI[p.j]+'</div></div>').join('')+'</div>';
   h+='<p class="note" style="text-align:center">일간 '+GAN[sj.dayGan]+'('+GANH[sj.dayGan]+') · '+sj.yinYang+'간 · '+sj.dayEl+' 기운'+(sj.hourKnown?' · 지방시 보정 적용':' · 시주 제외 간이 리딩')+'</p>';
   const total=Object.values(sj.cnt).reduce((a,b)=>a+b,0);
   ['목','화','토','금','수'].forEach(e=>{
     h+='<div class="ebar"><span class="en">'+esq(e)+' '+e+'</span><span class="et"><i class="ef" style="width:'+(sj.cnt[e]/total*100)+'%;background:var('+ELEM[e]+')"></i></span><span>'+sj.cnt[e]+'</span></div>';});
   if(sj.boundary)h+='<p class="note" style="margin-top:12px;line-height:1.3">※ 절기 경계일(±1일) 부근 출생이에요. 간이 계산 특성상 월주에 오차가 있을 수 있어요.</p>';
   if(sj.hourBoundary)h+='<p class="note" style="margin-top:12px;line-height:1.3">※ 지방시 보정 후 시진 경계 부근 출생이에요. 시주가 실제와 다를 수 있어요.</p>';
   if(sj.dayShifted)h+='<p class="note" style="margin-top:12px;line-height:1.3">※ 지방시 보정으로 자정을 넘어, 하루 전날 기준으로 사주를 계산했어요.</p>';
   h+='</div>';
   h+=sajuReadCard(sj);
 }
 h+='<div class="legend">본 리딩은 재미로 보는 콘텐츠이며, 사주는 절기 근사 방식의 간이 계산이에요.</div>';
 mainEl.innerHTML=h;
 document.getElementById('arcBack').onclick=()=>{S.arcView=null;save();render();scrollTo({top:0});};
}
render();
/* ══════════ 스플래시 → 랜딩 (앱을 열 때마다) ══════════ */
(function(){
  const splash=document.getElementById('splashScreen'), landing=document.getElementById('landingScreen');
  landing.style.display='none';
  setTimeout(()=>{
    /* 랜딩을 스플래시보다 먼저 깔아둔 뒤(스플래시가 z-index 위라 아직
       안 보임) 스플래시를 투명화, 그래야 스플래시가 사라지는 1.5초
       동안 메인 페이지가 아니라 랜딩이 자연스럽게 드러난다 */
    landing.style.display='flex';

    setTimeout(()=>{splash.style.display='none';},1500);
  },2000);
  landing.onclick=()=>{
    landing.classList.add('fade-out');
    setTimeout(()=>{landing.style.display='none';},1000);
  };
})();

/* ══════════ PWA 설치 유도 배너 ══════════ */
(function(){
  const DISM_KEY='loveTypeInstallDismV1';
  const banner=document.getElementById('installBanner');
  let deferredPrompt=null;
  // 홈 화면에 설치된 상태인지 / 아이폰·아이패드인지
  function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;}
  function isIOS(){return /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());}
  // 배너를 닫고 다시 보이지 않게 기록한다
  function dismiss(){localStorage.setItem(DISM_KEY,'1');banner.classList.remove('show');}
  // 설치 안내 배너를 띄운다 (안드로이드는 설치 버튼, 아이폰은 공유 메뉴 안내)
  function show(mode){
    if(isStandalone()||localStorage.getItem(DISM_KEY))return;
    banner.innerHTML = mode==='ios'
      ? '<span>홈 화면에 추가하면 앱처럼 빠르게 열 수 있어요. 공유 버튼 → \'홈 화면에 추가\'를 눌러보세요.</span><button id="instClose">닫기</button>'
      : '<span>홈 화면에 추가하면 앱처럼 빠르게 열 수 있어요.</span><button class="go" id="instGo">추가하기</button><button id="instClose">닫기</button>';
    banner.classList.add('show');
    document.getElementById('instClose').onclick=dismiss;
    const go=document.getElementById('instGo');
    if(go)go.onclick=async()=>{
      if(!deferredPrompt)return;
      deferredPrompt.prompt();
      try{await deferredPrompt.userChoice;}catch(e){}
      deferredPrompt=null; dismiss();
    };
  }
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;show('android');});
  window.addEventListener('appinstalled',dismiss);
  if(isIOS())show('ios');
})();
</script>
