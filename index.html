<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f0e1">
<title>연애 유형 진단소</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f0e1; --card:#fdfaf1; --ink:#3c352a; --sub:#8b8069;
    --line:#e4dac3; --green:#2f5d44; --green-soft:#e9efe8;
    --red:#a3473b; --red-soft:#f2e3de; --radius:14px;
    /* 오행 색 */
    --e-mok:#3f7350; --e-hwa:#a3473b; --e-to:#b08d45; --e-geum:#9a948a; --e-su:#33475c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{background:var(--paper); color:var(--ink);
    font-family:'Apple SD Gothic Neo','Pretendard','Noto Sans KR',system-ui,sans-serif;
    font-size:15px; line-height:1.55; padding-bottom:40px;}
  .wrap{max-width:640px; margin:0 auto; padding:0 16px;}
  header{padding:26px 0 10px; text-align:center;}
  header h1{font-family:'Gowun Batang',serif; font-size:26px; font-weight:700; margin:0 0 4px; letter-spacing:.02em;}
  header h1 .dot{color:var(--green);}
  header p{margin:0; color:var(--sub); font-size:13px;}
  .disclaimer{display:inline-block; margin-top:8px; font-size:11.5px; color:var(--sub);
    border:1px solid var(--line); border-radius:99px; padding:2px 10px; background:var(--card);}
  nav{position:sticky; top:0; z-index:20; background:linear-gradient(var(--paper) 88%, rgba(246,240,225,0)); padding:10px 0 6px;}
  .tabs{display:flex; gap:6px; max-width:640px; margin:0 auto; padding:0 16px;}
  .tab{flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:99px; padding:7px 13px; font-size:13px; cursor:pointer;}
  .tab.on{background:var(--ink); color:var(--card); border-color:var(--ink);}
  .tab.on::before{content:''; display:inline-block; width:6px; height:6px; border-radius:50%;
    background:var(--green); margin-right:6px; vertical-align:1px;}
  .sec-intro{margin:14px 2px 12px; font-size:13px; color:var(--sub);}
  .sec-intro b{color:var(--ink); font-family:'Gowun Batang',serif; font-size:15px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 15px 14px; margin-bottom:12px;}
  .q-num{font-family:'Gowun Batang',serif; font-size:13px; color:var(--green); font-weight:700;}
  .q-title{font-weight:700; font-size:16px; margin:4px 0 12px;}
  .opt{display:block; width:100%; text-align:left; border:1px solid var(--line); background:var(--paper);
    color:var(--ink); border-radius:12px; padding:12px 13px; font:inherit; font-size:14px;
    line-height:1.45; cursor:pointer; margin-bottom:8px;}
  .opt.sel{background:var(--ink); color:var(--card); border-color:var(--ink);}
  .progress{font-size:12px; color:var(--sub); text-align:center; margin:2px 0 10px; font-variant-numeric:tabular-nums;}
  .pbar{height:4px; background:var(--line); border-radius:99px; overflow:hidden; margin:0 2px 14px;}
  .pbar i{display:block; height:100%; background:var(--green); border-radius:99px; transition:.2s;}
  .btnrow{display:flex; gap:8px; margin-top:6px;}
  .btn{flex:1; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:12px; padding:12px; font:inherit; font-size:14px; cursor:pointer; font-weight:600;}
  .btn.primary{background:var(--green); border-color:var(--green); color:#f6f0e1; font-weight:700;}
  .btn.danger{color:var(--red); border-color:#dcc0b8;}
  .btn:disabled{opacity:.4;}
  /* 결과 카드 */
  .tcard{text-align:center; padding:20px 15px 16px;}
  .tcard .tno{font-family:'Gowun Batang',serif; color:var(--green); font-size:13px; font-weight:700;}
  .tcard h2{font-family:'Gowun Batang',serif; font-size:23px; margin:4px 0 2px;}
  .tcard .catch{color:var(--sub); font-size:13.5px; margin-bottom:12px;}
  .tags{display:flex; flex-wrap:wrap; gap:6px; justify-content:center;}
  .tagchip{border:1px solid var(--line); background:var(--paper); border-radius:99px;
    padding:4px 11px; font-size:12px; display:inline-flex; align-items:center; gap:6px;}
  .esq{width:10px; height:10px; border-radius:3px; border:1px solid rgba(60,53,42,.25); display:inline-block;}
  .axisline{font-size:12.5px; color:var(--sub); margin-top:10px;}
  .axisline b{color:var(--ink);}
  .switch-note{margin-top:8px; font-size:12px; color:var(--red); background:var(--red-soft);
    border-radius:10px; padding:6px 10px; display:inline-block;}
  h3.sec{font-family:'Gowun Batang',serif; font-size:14.5px; color:var(--green);
    border-bottom:1px solid var(--line); padding-bottom:5px; margin:16px 0 8px;}
  .r-item{padding:7px 0; border-bottom:1px dashed #eee5d0; font-size:13.5px;}
  .r-item:last-child{border-bottom:none;}
  .r-title{font-weight:700;}
  ul.bl{margin:6px 0 2px; padding-left:18px;}
  ul.bl li{margin-bottom:5px; font-size:13.5px;}
  details{border:1px solid var(--line); border-radius:12px; background:var(--paper);
    padding:10px 12px; margin-top:10px;}
  summary{cursor:pointer; font-size:13px; font-weight:700; color:var(--green);}
  .note{font-size:12px; color:var(--sub);}
  .sig{border:1px dashed var(--line); border-radius:12px; padding:9px 11px; margin-top:8px;
    font-size:13px; text-align:left; background:var(--paper);}
  .sig b{color:var(--green);}
  /* 심화 입력 */
  .fld{margin-bottom:12px;}
  .fld label{display:block; font-size:12.5px; color:var(--sub); margin-bottom:5px; font-weight:600;}
  select,input[type=text]{border:1px solid var(--line); border-radius:10px; background:#fffef9;
    color:var(--ink); font:inherit; font-size:14px; padding:9px 10px;}
  .selrow{display:flex; gap:6px;}
  .selrow select{flex:1;}
  .slider-row{margin-bottom:14px;}
  .slider-labels{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:2px;
    font-variant-numeric:tabular-nums;}
  .slider-labels b{color:var(--green);}
  input[type=range]{width:100%; accent-color:var(--green);}
  /* 근거·사주 */
  .ev{border-left:3px solid var(--green-soft); padding:6px 10px; margin:8px 0; font-size:12.8px;
    background:var(--paper); border-radius:0 10px 10px 0;}
  .ev b{font-family:'Gowun Batang',serif; color:var(--green);}
  .grade{display:inline-block; border:1px solid var(--green); color:var(--green); border-radius:99px;
    padding:3px 12px; font-size:12.5px; font-weight:700; background:var(--green-soft);}
  .pillars{display:flex; gap:6px; justify-content:center; margin:10px 0 6px;}
  .pillar{flex:1; max-width:86px; border:1px solid var(--line); border-radius:10px; background:var(--paper);
    padding:8px 4px; text-align:center;}
  .pillar .pl{font-size:10.5px; color:var(--sub);}
  .pillar .pg{font-family:'Gowun Batang',serif; font-size:15px; font-weight:700; margin-top:2px;}
  .pillar .ph{font-size:11px; color:var(--sub);}
  .ebar{display:flex; align-items:center; gap:6px; font-size:12px; margin-top:4px;}
  .ebar .en{width:34px;}
  .ebar .et{flex:1; height:8px; background:var(--paper); border:1px solid var(--line); border-radius:99px; overflow:hidden;}
  .ebar .ef{display:block; height:100%;}
  .warn{font-size:12px; color:var(--red); background:var(--red-soft); border-radius:10px; padding:7px 10px; margin-top:8px;}
  .atbox{border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-top:8px; background:var(--paper); font-size:13px;}
  .atbox b{color:var(--green);}
  .atbox .shadow{color:var(--sub);}
  /* 궁합 */
  .verdict{text-align:center; padding:16px;}
  .verdict h2{font-family:'Gowun Batang',serif; margin:6px 0;}
  /* 보관함 */
  .arc-item{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:13px 14px; margin-bottom:10px; display:flex; align-items:center; gap:10px;}
  .arc-item .seal{width:10px; height:10px; border-radius:50%; background:var(--green); flex:0 0 auto;}
  .arc-item .info{flex:1; font-size:13.5px;}
  .arc-item .info small{display:block; color:var(--sub); font-size:12px;}
  .arc-empty{text-align:center; color:var(--sub); font-size:13px; padding:36px 0;}
  .arc-del{border:none; background:none; color:var(--red); font-size:12px; cursor:pointer;}
  .legend{font-size:11.5px; color:var(--sub); margin:16px 0 6px; text-align:center;}
  #toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(10px);
    background:var(--ink); color:var(--card); font-size:13px; padding:9px 16px; border-radius:99px;
    opacity:0; pointer-events:none; transition:.25s; z-index:50; max-width:88%; text-align:center;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<header class="wrap">
  <h1>연애 유형 진단소<span class="dot">.</span></h1>
  <p>재미로 보는 나의 연애 유형 · 사주와 MBTI로 읽는 심화 리딩</p>
  <span class="disclaimer">본 결과는 재미로 보는 셀프 리딩이에요</span>
</header>
<nav><div class="tabs" id="tabs"></div></nav>
<main class="wrap" id="main"></main>
<div id="toast"></div>

<script>
/* ══════════ 데이터 ══════════ */
const AXES=[
 {name:'표현', front:'직진', back:'신중'},
 {name:'온도', front:'불꽃', back:'잔잔'},
 {name:'판단', front:'낭만', back:'현실'}
];
/* 문항: ax 0~2 = 축, 'S1'~'S4' = 시그널. 보기 [앞성향, 중간, 뒷성향] — 라벨은 UI에 노출하지 않음 */
const QS=[
 {ax:0,t:'단톡방에서 자꾸 눈이 가는 사람이 생겼다.',o:['보통은 먼저 개인톡을 걸어보는 편이다','단톡방 안에서 반응을 주고받으며 간을 보는 편이다','일단은 지켜보며 마음부터 정리하는 편인 것 같다']},
 {ax:0,t:'썸 상대가 3일 잠수 후 "미안, 바빴어"라며 연락이 왔다.',o:['"연락 기다렸잖아"라고 솔직하게 말하는 편이다','가볍게 받아주되 서운함은 살짝 티 내는 편이다','아무렇지 않은 척하고 속으로만 정리하는 편이다']},
 {ax:0,t:'마음에 드는 사람과 단둘이 좋은 시간을 보낸 날.',o:['헤어지기 전에 다음 약속 얘기를 꺼내는 편일 것 같다','헤어진 직후 연락으로 마음을 전하는 편이다','며칠 상대의 신호를 살핀 뒤에 움직이는 편이다']},
 {ax:0,t:'좋아하는 마음이 커졌다. 고백은?',o:['대부분 내가 먼저 말하게 되는 것 같다','분위기를 만들어 자연스럽게 서로 확인하는 편이다','확신이 설 때까지는 아껴두는 편이다']},
 {ax:0,t:'친구가 "너 그 사람 좋아하지?"라고 물으면?',o:['"어떻게 알았어?" 하고 인정하는 편이다','웃으며 얼버무리는 편이다','아직 들키지 않았다고 믿고 싶다']},
 {ax:'S1',t:'나에게 더 끌리는 연애는?',o:['도파민 팡팡, 롤러코스터처럼 나를 자극하는 상대와의 연애','설렘과 편안함이 반반이면 좋겠다','잔잔하고 다정한 상대와의 예측 가능한 연애']},
 {ax:1,t:'애인이 생기면 내 일상은?',o:['우선순위가 확 바뀌어 연애 중심이 되는 편인 것 같다','초반엔 쏠리지만 점차 균형을 찾아가는 편이다','원래의 리듬을 크게 바꾸지 않으려는 편이다']},
 {ax:1,t:'좋아하는 사람이 생기면 머릿속은?',o:['하루의 많은 부분이 그 사람 생각으로 차 있는 것 같다','문득문득 떠오르지만 할 일은 하는 편이다','볼 때 좋고, 안 볼 땐 내 일에 집중이 되는 편이다']},
 {ax:1,t:'오랜만에 애인을 만나러 가는 길.',o:['며칠 전부터 들떠서 머릿속이 계획으로 가득한 편이다','당일 아침부터 설레기 시작하는 편이다','설레긴 해도 겉은 평소 텐션과 비슷한 것 같다']},
 {ax:1,t:'연애 3개월 차, 나의 마음 그래프는?',o:['여전히 최고점, 더 뜨거워지는 편인 것 같다','완만해지다가도 함께하는 순간마다 다시 치솟는 편이다','초반의 불꽃보다 편안한 온기가 더 좋아지는 편이다']},
 {ax:1,t:'좋아하는 사람의 취향(음악·취미)을 알게 되면?',o:['나도 바로 찾아보고 같이 빠져드는 편이다','관심은 갖지만 내 취향도 유지하는 편이다','존중하지만 굳이 따라 하지는 않는 것 같다']},
 {ax:'S3',t:'상대의 마음이 문득 궁금해질 때?',o:['직접 물어봐야 마음이 놓이는 편이다','궁금하지만 며칠 지켜보는 편이다','굳이 확인하지 않아도 크게 불안하지 않은 편이다']},
 {ax:2,t:'친구가 "조건은 별로인데 너무 좋아하는 사람" 얘기를 하면?',o:['"마음 가는 대로 가야지" 응원부터 하는 편이다','응원하면서도 현실 조건을 한 번은 짚어주는 편이다','보통은 냉정하게 현실 체크부터 해주는 것 같다']},
 {ax:2,t:'영화 같은 우연한 만남, \'운명\'에 대해서는?',o:['운명적 사랑이 어딘가엔 있다고 믿는 편이다','반쯤 믿고, 반쯤은 만들어가는 것이라 생각한다','사랑은 타이밍과 노력의 결과라고 보는 편이다']},
 {ax:2,t:'애인이 "우리 나중에 바닷가 마을에서 살자"라고 하면?',o:['상상만으로 행복해져 같이 그림을 그리는 편이다','즐겁게 맞장구치지만 속으론 \'글쎄\' 하는 편이다','직장·생활비 같은 현실 조건이 먼저 떠오르는 것 같다']},
 {ax:2,t:'연애 중 큰 결정(예: 장거리 제안)의 순간이 오면?',o:['결국 마음이 시키는 쪽을 따르는 편일 것 같다','마음 7 : 현실 3 정도로 섞어서 정하는 편이다','장단점을 적어보고 결론을 내는 편이다']},
 {ax:2,t:'\'사랑\'을 정의한다면 어느 쪽에 가깝나?',o:['기적처럼 찾아오는 감정에 가깝다고 생각한다','감정에서 시작해 노력으로 완성되는 것이라 본다','서로에 대한 신뢰와 책임에 가깝다고 본다']},
 {ax:'S2',t:'애인의 연락과 관심이 아주 잦다면?',o:['사랑받는 느낌이라 좋을 것 같다','좋지만 가끔은 살짝 벅찰 때도 있을 듯하다','솔직히 조금 지치고, 나만의 공간이 필요한 편이다']},
 {ax:'S4',t:'연애가 끝난 뒤의 나는?',o:['힘들어도 비교적 금방 일상으로 복귀하는 편이다','한동안 앓다가 서서히 회복하는 편이다','여운이 꽤 오래 남는 편인 것 같다']}
];
/* 시그널 해석 (양면 서술) */
const SIGS={
 S1:{a:['설렘 연료 시그널','자극과 새로움이 연애의 연료인 타입이에요. 관계에 생기를 불어넣는 재주가 있는 대신, 익숙해지는 구간에서는 새로운 경험을 함께 만드는 장치가 필요할 수 있어요.'],
     b:['안정 지향 시그널','예측 가능한 다정함에서 힘을 얻는 타입이에요. 관계를 오래 지키는 힘이 있는 대신, 가끔의 낯선 시도가 관계에 환기가 되어줄 수 있어요.']},
 S2:{a:['밀착 환영 시그널','촘촘한 연결이 애정으로 느껴지는 타입이에요. 상대를 외롭지 않게 하는 힘이 있는 대신, 상대의 혼자만의 시간도 애정의 한 형태임을 기억하면 좋아요.'],
     b:['마이페이스 시그널','나만의 공간이 충전소인 타입이에요. 자율을 존중받을 때 오히려 더 오래, 더 깊이 함께하는 사람이라 상대에게 이 사용법을 미리 알려주면 좋아요.']},

function jdn(y,m,d){const a=Math.floor((14-m)/12),y2=y+4800-a,m2=m+12*a-3;
 return d+Math.floor((153*m2+2)/5)+365*y2+Math.floor(y2/4)-Math.floor(y2/100)+Math.floor(y2/400)-32045;}
const TERMS=[[2,4],[3,6],[4,5],[5,6],[6,6],[7,7],[8,8],[9,8],[10,8],[11,7],[12,7]]; /* 인~자월 절입(근사) */
function nearBoundary(m,d){ /* 절기 경계 ±1일 여부 */
 const all=TERMS.concat([[1,6]]);
 return all.some(([tm,td])=>m===tm&&Math.abs(d-td)<=1);
}
function saju(y,m,d,h){ /* h: 0~23 or null(모름) */
 const ge=(mm,dd)=>(m>mm)||(m===mm&&d>=dd);
 const sy=ge(2,4)?y:y-1;
 const yg=((sy-4)%10+10)%10, yj=((sy-4)%12+12)%12;
 let mi; /* 0=인월 */
 if(m===1) mi=d>=6?11:10;
 else if(m===2&&d<4) mi=11;
 else{ mi=0; for(let k=0;k<TERMS.length;k++){ if(ge(TERMS[k][0],TERMS[k][1])) mi=k; } }
 const mg=(((yg%5)*2+2)+mi)%10, mj=(2+mi)%12;
 const di=((jdn(y,m,d)+49)%60+60)%60;
 const dg=di%10, dj=di%12;
 let hg=null,hj=null;
 if(h!==null){ hj=Math.floor(((h+1)%24)/2); hg=(((dg%5)*2)+hj)%10; }
 const pillars=[{l:'연주',g:yg,j:yj},{l:'월주',g:mg,j:mj},{l:'일주',g:dg,j:dj}];
 if(h!==null) pillars.push({l:'시주',g:hg,j:hj});
 const cnt={'목':0,'화':0,'토':0,'금':0,'수':0};
 pillars.forEach(p=>{cnt[GEL[p.g]]++; cnt[JEL[JI[p.j]]]++;});
 return {pillars,cnt,dayGan:dg,yinYang:dg%2===0?'양':'음',dayEl:GEL[dg],
   hourKnown:h!==null,boundary:nearBoundary(m,d)};
}

function resolveAxis(i, bDir, bScore, mH, sH, recAns){
 /* 반환 {dir, status, needRec, lines[]} — status: agree|ignite|adjust|explore */
 const L=[];const ax=AXES[i];

 L.push('행동: '+dn(bDir==='sw'?'?':bDir)+' '+(bDir==='sw'?'(스위치 '+bScore+'/5)':bScore+'/5'));
 if(recAns){ /* 재확인 완료 후 최종 판정 */
   const rSum=recAns[0]+recAns[1];
   let rDir = rSum>=2?1:(rSum<=0?0:null);
   if(rDir===null){ rDir = bDir==='sw' ? null : bDir; }
   let vote=0;
   if(rDir!==null)vote+=(rDir===1?2:-2);
   if(mH!==null)vote+=(mH===1?1:-1);
   if(sH!==null)vote+=(sH===1?1:-1);
   let dir,status;
   if(vote>0){dir=1;status='adjust';}
   else if(vote<0){dir=0;status='adjust';}
   else{dir=bDir==='sw'?1:bDir;status='explore';}
   if(sH!==null&&sH!==dir&&status==='adjust')status='ignite';
   L.push('재확인: '+ (rDir===null?'양쪽 반반':dn(rDir)) +' → 가중 합산(행동2·후천1·선천1)으로 '+dn(dir)+' 확정');
   return {dir,status,needRec:false,lines:L};
 }
 if(bDir!=='sw'){
   const mAg=mH===null||mH===bDir, sAg=sH===null||sH===bDir;
   L.push('후천(MBTI): '+(mH===null?'중립 — 힌트 없음':dn(mH)+' 힌트'));
   L.push('선천(사주): '+(sH===null?'해당 오행 힌트 없음':dn(sH)+' 씨앗'));
   if(mAg&&sAg) return {dir:bDir,status:'agree',needRec:false,lines:L};
   if(mH===bDir&&sH!==null&&sH!==bDir){L.push('→ 타고난 씨앗과 다른 방향이 현재 발화 중이에요');return {dir:bDir,status:'ignite',needRec:false,lines:L};}
   L.push('→ 소스가 엇갈려 재확인 문항으로 확정해요');
   return {dir:bDir,status:'rec',needRec:true,lines:L};
 }else{
   L.push('후천(MBTI): '+(mH===null?'중립':dn(mH)+' 힌트'));
   L.push('선천(사주): '+(sH===null?'힌트 없음':dn(sH)+' 씨앗'));
   if(mH!==null&&sH!==null&&mH===sH){L.push('→ 스위치 축을 선천·후천 방향으로 보정했어요');return {dir:mH,status:'adjust',needRec:false,lines:L};}
   if(mH!==null&&sH===null){L.push('→ 후천 힌트로 보정');return {dir:mH,status:'adjust',needRec:false,lines:L};}
   if(sH!==null&&mH===null){L.push('→ 선천 힌트로 보정');return {dir:sH,status:'adjust',needRec:false,lines:L};}
   L.push('→ 힌트가 없거나 엇갈려 재확인 문항으로 확정해요');
   return {dir:null,status:'rec',needRec:true,lines:L};
 }
}

function downloadTxt(key,grade,eng){
 const T=TYPES[key];const L=[];
 L.push('══════════════════════');
 L.push(' 연애 유형 심화 리딩');
 L.push(' '+new Date().toLocaleString('ko-KR'));
 L.push('══════════════════════');
 L.push('');L.push('유형: '+T.no+' '+T.name+' ('+T.axes+')');
 L.push('한 줄: '+T.catch);
 L.push('태그: '+T.mbti.join('·')+' 감성 / '+T.zo+' / '+T.el);
 L.push('일관성 등급: '+grade);
 L.push('');
 ['p','l','t','m'].forEach(c=>{L.push('['+CATN[c]+']');T.rd[c].forEach(b=>L.push(' - '+b));L.push('');});
 L.push('[판정 근거]');
 eng.res.forEach((r,i)=>{L.push(AXES[i].name+'축 → '+(r.dir===1?AXES[i].front:AXES[i].back));r.lines.forEach(l=>L.push('  '+l));});
 L.push('');L.push('※ 재미로 보는 콘텐츠 · 사주는 간이 계산');
 const blob=new Blob([L.join('\n')],{type:'text/plain;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='love_type_reading.txt';a.click();URL.revokeObjectURL(a.href);
}
/* ── 궁합 미리보기 ── */
function compat(a,b){
 if(a===b)return ['거울조합','같은 유형끼리의 만남. 세상 편안하고 서로가 서로의 사용설명서예요. 다만 둘 다 같은 걸 망설일 수 있으니, 먼저 움직일 담당을 정해두면 좋아요.'];
 let diff=0;for(let i=0;i<3;i++)if(a[i]!==b[i])diff++;
 if(diff===3)return ['환장조합','세 축이 모두 반대! 서로가 외계인처럼 신기한 조합이에요. 이해하려 들기보다 관찰하고 존중하면, 서로에게 없는 것을 배우는 최고의 성장 조합이 되기도 해요.'];
 if(a[0]!==b[0]&&a[1]===b[1]&&a[2]===b[2])return ['꿀조합','다가가는 속도만 다를 뿐, 연애의 온도와 가치관이 같은 조합이에요. 한쪽이 문을 두드리고 한쪽이 열어주는, 서로에게 끌릴 수밖에 없는 합이에요.'];
 const c=[];
 if(a[0]===b[0])c.push('속도가 맞는 사이');
 if(a[1]===b[1])c.push('연애 온도가 맞는 사이');
 if(a[2]===b[2])c.push('말이 통하는 사이');
 return ['무난조합','무난하다는 건 함께 만들 여지가 많다는 뜻이에요. 이 조합은 '+c.join(', 그리고 ')+'. 다른 축의 차이는 서로의 세계를 넓혀주는 재료가 돼요.'];
}
function renderCompat(){
 let h='<div class="sec-intro"><b>궁합 미리보기</b><br>두 유형을 골라 조합을 확인해보세요. (재미로!)</div>';
 const opts=k=>Object.keys(TYPES).map(key=>'<option value="'+key+'" '+(k===key?'selected':'')+'>'+TYPES[key].name+'</option>').join('');
 h+='<div class="card"><div class="fld"><label>나의 유형</label><select id="cA" style="width:100%">'+opts(S.cmpA)+'</select></div>'+
 '<div class="fld"><label>상대의 유형</label><select id="cB" style="width:100%">'+opts(S.cmpB)+'</select></div></div>';
 const [vn,vd]=compat(S.cmpA,S.cmpB);
 h+='<div class="card verdict"><span class="tno" style="font-family:\'Gowun Batang\',serif;color:var(--green);font-size:13px;font-weight:700">'+
 TYPES[S.cmpA].name+' × '+TYPES[S.cmpB].name+'</span><h2>'+vn+'</h2><p style="font-size:13.5px">'+vd+'</p></div>';
 mainEl.innerHTML=h;
 document.getElementById('cA').onchange=e=>{S.cmpA=e.target.value;save();render();};
 document.getElementById('cB').onchange=e=>{S.cmpB=e.target.value;save();render();};
}
/* ── 보관함 ── */
function renderArc(){
 let h='<div class="sec-intro"><b>보관함</b><br>담아둔 결과가 쌓여요. 기록은 이 기기·이 브라우저에만 저장돼요.</div>';
 if(!ARC.length){h+='<div class="arc-empty">아직 담긴 결과가 없어요.<br>진단을 마치고 「보관하기」를 눌러보세요.</div>';mainEl.innerHTML=h;return;}
 mainEl.innerHTML=h;
 ARC.forEach((r,i)=>{
   const T=TYPES[r.key];const d=new Date(r.ts);
   const el=document.createElement('div');el.className='arc-item';
   el.innerHTML='<span class="seal"></span><span class="info"><b>'+T.name+'</b> · '+r.kind+(r.grade?' · '+r.grade:'')+
   '<small>'+d.toLocaleString('ko-KR')+'</small></span><button class="arc-del" data-i="'+i+'">삭제</button>';
   el.querySelector('.arc-del').onclick=()=>{if(confirm('이 기록을 삭제할까요?')){ARC.splice(i,1);saveArc();render();}};
   mainEl.appendChild(el);
 });
}
render();
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});
}
